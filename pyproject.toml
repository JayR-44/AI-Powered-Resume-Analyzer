[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "resume-checker"
version = "0.1.0"
description = "A multi-CV RAG assistant with Streamlit, LangChain, local embeddings, and Groq."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "langchain",
    "langchain-community",
    "langchain-core",
    "langchain-groq",
    "langchain-text-splitters",
    "fastembed",
    "pypdf",
    "python-dotenv",
    "streamlit>=1.57",
]

[project.scripts]
resume-checker = "resume_checker.main:main"

[tool.setuptools.packages.find]
where = ["src"]
